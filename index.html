<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="a36ebfe7-5522-44bd-8826-e6e29773395d.jpg">
<title>Q Luxury</title>

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>
body {
    font-family: "Tajawal", sans-serif;
    background: linear-gradient(180deg, #0f0f0f, #1a1a1a);
    margin: 0;
    padding: 15px;
    color: #ffffff;
    overflow-x: hidden;
}

/* 🌙 الهلال */
.ramadan-crescent {
  position: fixed;
  top: 18px;
  left: 18px;
  width: 70px;
  height: 70px;
  border-radius: 50%;
  box-shadow: -12px 0 0 4px #c6a55c, 0 0 20px rgba(198,165,92,0.4);
  animation: crescentFloat 6s ease-in-out infinite;
  opacity: 0.9;
  z-index: 999;
}

/* ⭐ نجوم */
.ramadan-star {
  position: fixed;
  color: #c6a55c;
  pointer-events: none;
  z-index: 900;
  opacity: 0.7;
  text-shadow: 0 0 6px #c6a55c, 0 0 14px rgba(198,165,92,0.6);
  user-select: none;
}

h2 {
    text-align: center;
    font-size: 28px;
    margin: 20px 0;
    font-weight: 700;
    color: #c6a55c;
}

.product {
    background: linear-gradient(180deg, #1a1a1a, #141414);
    padding: 18px;
    margin-bottom: 22px;
    border-radius: 20px;
    border: 1px solid #2a2a2a;
    box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    transition: 0.3s;
}

.product:hover {
    transform: translateY(-4px);
    box-shadow: 0 6px 25px rgba(198,165,92,0.2);
}

.product h3 {
    font-size: 22px;
    margin: 10px 0;
    color: #ffffff;
}

.product p {
    color: #c9c9c9;
    font-size: 16px;
}

.buyNowBtn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: linear-gradient(135deg, #c6a55c, #a67c2d);
    color: #000;
    width: 100%;
    padding: 14px;
    border-radius: 14px;
    border: none;
    font-size: 20px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.3s;
}

.buyNowBtn:hover {
    background: linear-gradient(135deg, #d4b26a, #b88a35);
    transform: scale(1.03);
}

#checkoutPage {
    background: linear-gradient(180deg, #1a1a1a, #141414);
    padding: 22px;
    border-radius: 22px;
    margin-top: 20px;
    border: 1px solid #2a2a2a;
    box-shadow: 0 4px 25px rgba(0,0,0,0.6);
    display: none;
}

input, textarea, select {
    width: 100%;
    padding: 14px;
    margin: 10px 0;
    border-radius: 12px;
    font-size: 18px;
    background: #111;
    color: #fff;
    border: 1px solid #2a2a2a;
}

input:focus, textarea:focus, select:focus {
    border-color: #c6a55c;
    outline: none;
}

.size-title {
  text-align: center;
  font-size: 20px;
  font-weight: 700;
  margin: 4px 0 10px;
  color: #c6a55c;
}

.size-btn {
  padding: 12px 26px;
  border-radius: 12px;
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
  background: #1a1a1a;
  color: #fff;
  border: 1px solid #2a2a2a;
  transition: 0.3s;
}

.size-btn:hover {
  border-color: #c6a55c;
}

.size-btn.active {
  background: linear-gradient(135deg, #c6a55c, #a67c2d);
  color: #000;
  border-color: #c6a55c;
}

.social-float img {
  background: #1a1a1a;
  border: 1px solid #2a2a2a;
}
</style>
</head>

<body>

<!-- 🌙 الهلال -->
<div class="ramadan-crescent"></div>

<div class="social-float">
  <a href="https://www.instagram.com/q.luxury09?igsh=MThzM3V3bTY2ZnoxNg%3D%3D&utm_source=qr" target="_blank">
    <img src="WhatsApp Image 2026-02-09 at 8.11.29 PM.jpeg" alt="Instagram">
  </a>
  <a href="https://www.tiktok.com/@q.luxury09?_r=1&_t=ZS-93mewJgvedB" target="_blank">
    <img src="WhatsApp Image 2026-02-09 at 8.15.47 PM.jpeg" alt="TikTok">
  </a>
</div>

<h2>🛍️ عطورنا</h2>

<div class="size-title">اختر حجم العلبة</div>
<div class="size-filter" aria-hidden="false">
  <button id="size100" class="size-btn" type="button">100ml</button>
  <button id="size50" class="size-btn" type="button">50ml</button>
  <button id="size35" class="size-btn" type="button">35ml</button>
</div>

<div id="products"></div>

<div id="checkoutPage">
    <h2>إتمام الطلب</h2>

    <h3 id="prodName" style="text-align:center; margin-bottom: 10px; color:#000"></h3>
    <h3 id="prodPrice" style="text-align:center; margin-top:-10px; color:#444"></h3>

    <label>المنطقة:</label>
    <select id="region" onchange="updateCheckout()">
        <option value="none">اختر المنطقة</option>
        <option value="westbank">الضفة — ₪20</option>
        <option value="jerusalem">القدس — ₪30</option>
        <option value="inside48">الداخل — ₪70</option>
    </select>

    <label>العنوان بالتفصيل:</label>
    <input type="text" id="address">
    
    <label>الاسم الكامل:</label>
    <input type="text" id="fullname">

    <label>رقم الهاتف:</label>
    <input type="text" id="phone">

   <label>ملاحظات:</label>
    <textarea id="notes"></textarea>

    <h3 id="checkoutTotal" style="text-align:center;"></h3>

    <button onclick="sendOrder()" class="buyNowBtn">
        إرسال الطلب
    </button>
</div>

<script>
let products = [];
let currentSize = "100ml";
const unavailable = ["Q Quantum - كيو كوانتوم", "Q Aero Fresh - كيو إيرو فريش"];

fetch("products.json")
  .then(res => res.json())
  .then(data => {
      products = data;
      setActiveSizeButton(currentSize);
      loadProducts();
  });

function setActiveSizeButton(size){
  const btn100 = document.getElementById("size100");
  const btn50 = document.getElementById("size50");
  const btn30 = document.getElementById("size35");
  btn100.classList.toggle("active", size === "100ml");
  btn50.classList.toggle("active", size === "50ml");
  btn30?.classList.toggle("active", size === "35ml");
}

document.getElementById("size100").addEventListener("click", () => { currentSize = "100ml"; setActiveSizeButton(currentSize); loadProducts(); });
document.getElementById("size50").addEventListener("click", () => { currentSize = "50ml"; setActiveSizeButton(currentSize); loadProducts(); });
document.getElementById("size35")?.addEventListener("click", () => { currentSize = "35ml"; setActiveSizeButton(currentSize); loadProducts(); });

function loadProducts(){
    const box = document.getElementById("products");
    box.innerHTML = "";

    products.forEach((p, i)=>{
        let display = p.options?.find(o => o.size === currentSize) || p;
        if(!display) return;

        box.innerHTML += `
            <div class="product">
                <img src="${display.img || p.img || ''}" alt="${p.name}">
                <h3>${p.name}</h3>
                <p>${display.desc || p.desc || ''}</p>
                <p><b>₪${display.price !== undefined ? display.price : (p.price !== undefined ? p.price : '')}</b></p>

                ${unavailable.includes(p.name) ? `<button class="buyNowBtn" style="background:#cfcfcf;color:#000;cursor:not-allowed;pointer-events:none">غير متوفر الآن</button>` : `<button class="buyNowBtn" onclick="buyNow(${i})">شراء الآن</button>`}
            </div>
        `;
    });
}

let lastBuy = [];
function buyNow(i){
    const prod = products[i];
    if(!prod) return;
    const chosenPrice = prod.options?.find(o => o.size === currentSize)?.price || prod.price;
    lastBuy = [{ name: prod.name, price: chosenPrice }];
    openCheckout();
    document.getElementById("prodName").innerText = lastBuy[0].name;
    document.getElementById("prodPrice").innerText = "سعر العطر: ₪" + lastBuy[0].price;
}

const shipping = { jerusalem:30, westbank:20, inside48:70 };

function openCheckout(){
    const checkout = document.getElementById("checkoutPage");
    checkout.style.display = "block";
    updateCheckout();
    checkout.scrollIntoView({ behavior: "smooth" });
}

function updateCheckout(){
    const region = document.getElementById("region").value;
    let price = Number(lastBuy[0].price);
    let total = price + (shipping[region] || 0);
    document.getElementById("checkoutTotal").innerHTML = `سعر العطر: ₪${price}<br>المجموع الكلي شامل التوصيل: ₪${total}`;
}

function sendOrder(){
    const name = document.getElementById("fullname").value;
    const phoneNumber = document.getElementById("phone").value;
    const addr = document.getElementById("address").value;
    const region = document.getElementById("region").value;
    const notesText = document.getElementById("notes").value;

    if(!name || !phoneNumber || !addr || region === "none"){ alert("يرجى تعبئة جميع البيانات"); return; }

    const price = Number(lastBuy[0].price);
    const total = price + shipping[region];

    const msg = `طلب جديد:
الاسم: ${name}
الهاتف: ${phoneNumber}
العنوان: ${addr}
المنطقة: ${region}

المنتج:
${lastBuy[0].name}
الحجم: ${currentSize}
سعر العطر: ₪${price}
المجموع الكلي شامل التوصيل: ₪${total}

ملاحظات:
${notesText}`;

    const waNumber = "970595479161";
    window.location.href = "https://wa.me/" + waNumber + "?text=" + encodeURIComponent(msg);
}

/* ⭐ نجوم متحركة */
const stars = [];
const numStars = 30;
for(let i=0;i<numStars;i++){
    const star=document.createElement('div');
    star.className='ramadan-star';
    star.textContent='✦';
    star.style.top=Math.random()*window.innerHeight+'px';
    star.style.left=Math.random()*window.innerWidth+'px';
    star.style.fontSize=(8+Math.random()*12)+'px';
    star.dataset.x = parseFloat(star.style.left);
    star.dataset.y = parseFloat(star.style.top);
    star.dataset.speedX = (Math.random()<0.5?-1:1)*(0.2+Math.random()*0.5);
    star.dataset.speedY = (Math.random()<0.5?-1:1)*(0.2+Math.random()*0.5);
    stars.push(star);
    document.body.appendChild(star);
}

function animateStars(){
    stars.forEach(star=>{
        let x = parseFloat(star.dataset.x);
        let y = parseFloat(star.dataset.y);
        x += parseFloat(star.dataset.speedX);
        y += parseFloat(star.dataset.speedY);
        if(y<0 || y>window.innerHeight) star.dataset.speedY*=-1;
        if(x<0 || x>window.innerWidth) star.dataset.speedX*=-1;
        star.dataset.x=x;
        star.dataset.y=y;
        star.style.top=y+'px';
        star.style.left=x+'px';
    });
    requestAnimationFrame(animateStars);
}
animateStars();
</script>

</body>
</html>
