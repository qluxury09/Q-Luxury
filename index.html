<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q Luxury</title>

<style>
body {
    font-family: sans-serif;
    background: #ffe7c2;
    padding: 15px;
    margin: 0;
    font-size: 18px;
}
button, a {
    cursor: pointer;
    border: none;
    border-radius: 8px;
    font-size: 18px;
    padding: 12px 20px;
}
.hidden { display: none; }
header {
    display: flex;
    gap: 15px;
    margin-bottom: 20px;
}
#products .product {
    background: white;
    padding: 20px;
    border-radius: 15px;
    margin-bottom: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
}
.product img {
    width: 100%;
    max-width: 260px;
    border-radius: 15px;
}
.buyNowBtn {
    background: #000;
    color: white;
    width: 100%;
}
#checkoutPage {
    background:white;
    padding:20px;
    border-radius:15px;
}
input, textarea, select {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    font-size: 18px;
    border-radius: 8px;
}
#checkoutPage h2, #checkoutPage h3 {
    text-align: center;
}
</style>
</head>
<body>

<!-- الشعار -->
<div style="text-align:center; margin-bottom: 25px;">
    <img src="logo.png" alt="Q.Luxury" style="width:170px; height:170px; border-radius:50%; object-fit:cover;">
</div>

<h2>المنتجات</h2>
<div id="products"></div>

<!-- صفحة الإتمام -->
<div id="checkoutPage" class="hidden">
    <button onclick="closeCheckout()" style="background:#000;color:white;border-radius:10px;padding:10px 20px;margin-bottom:15px;">⬅ الرجوع</button>

    <h2>إتمام الطلب</h2>

    <label>المنطقة:</label>
    <select id="region" onchange="updateCheckout()">
        <option value="none">اختر المنطقة</option>
        <option value="westbank">الضفة الغربية ₪20</option>
        <option value="jerusalem">القدس ₪30</option>
        <option value="inside48">الداخل المحتل ₪70</option>
    </select>

    <label>الاسم الكامل:</label>
    <input type="text" id="fullname">

    <label>الهاتف:</label>
    <input type="text" id="phone">

    <label>العنوان:</label>
    <input type="text" id="address">

    <label>ملاحظات:</label>
    <textarea id="notes"></textarea>

    <h3 id="checkoutTotal"></h3>

    <button onclick="sendOrder()" class="buyNowBtn">إرسال الطلب عبر واتساب</button>
</div>

<script>
/* تحميل المنتجات من JSON */
let products = [];

fetch("products.json")
  .then(res => res.json())
  .then(data => {
      products = data;
      loadProducts();
  });

function loadProducts(){
    let box = document.getElementById("products");
    box.innerHTML = "";

    products.forEach((p, i)=>{
        box.innerHTML += `
            <div class="product">
                <img src="${p.img}">
                <h3>${p.name}</h3>
                <p>${p.desc}</p>
                <p><b>₪${p.price}</b></p>
                <button class="buyNowBtn" onclick="buyNow(${i})">شراء الآن</button>
            </div>
        `;
    });
}

let lastBuy = [];
let shipping = { westbank:20, jerusalem:30, inside48:70 };

function buyNow(i){
    lastBuy = [products[i]];
    openCheckout();
}

function openCheckout(){
    document.getElementById("checkoutPage").classList.remove("hidden");
    updateCheckout();
}

function closeCheckout(){
    document.getElementById("checkoutPage").classList.add("hidden");
}

function updateCheckout(){
    let region = document.getElementById("region").value;
    let total = lastBuy.reduce((a,b)=>a+Number(b.price),0);

    if(region !== "none"){
        total += shipping[region];
    }

    document.getElementById("checkoutTotal").innerHTML = "المجموع النهائي: ₪" + total;
}

function sendOrder(){
    let name = fullname.value;
    let phoneNumber = phone.value;
    let addr = address.value;
    let region = document.getElementById("region").value;

    if(!name || !phoneNumber || !addr || region === "none"){
        alert("يرجى تعبئة جميع البيانات");
        return;
    }

    let items = lastBuy.map(p => `• ${p.name} - ₪${p.price}`).join("\n");

    let msg =
`طلب جديد:
---------------------
الاسم: ${name}
الهاتف: ${phoneNumber}
المنطقة: ${region}
العنوان: ${addr}

المنتجات:
${items}

ملاحظات:
${notes.value}
---------------------`;

    window.location.href =
       "https://wa.me/00970595479161?text=" + encodeURIComponent(msg);
}
</script>

</body>
</html>
