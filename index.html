<!-- العنوان الأساسي -->
<h2 style="text-align:center; font-size:28px; margin-top:40px; font-weight:bold;">
  عطورنا
</h2>

<!-- عنوان اختيار الحجم -->
<h3 style="text-align:center; font-size:22px; margin-top:10px; font-weight:600;">
  اختر حجم العلبة
</h3>

<!-- أزرار الاختيار -->
<div style="display:flex; justify-content:center; gap:20px; margin-top:15px;">

  <button id="btn100" 
    style="
      padding:15px 30px;
      font-size:20px;
      font-weight:bold;
      border-radius:12px;
      border:none;
      cursor:pointer;
      background:#000;
      color:white;
      transition:0.3s;">
    100ML
  </button>

  <button id="btn50" 
    style="
      padding:15px 30px;
      font-size:20px;
      font-weight:bold;
      border-radius:12px;
      border:none;
      cursor:pointer;
      background:#e4e4e4;
      color:black;
      transition:0.3s;">
    50ML
  </button>

</div>

<!-- مكان عرض المنتجات -->
<div id="productsContainer" style="margin-top:40px;"></div>


<script>
let products = [];
let currentSize = "100ml"; // الحجم الافتراضي عند فتح الموقع

// جلب ملف المنتجات
fetch("products.json")
  .then(res => res.json())
  .then(data => {
    products = data;
    displayProducts(currentSize);
  });

// دالة عرض المنتجات حسب الحجم
function displayProducts(size) {
  currentSize = size;
  const container = document.getElementById("productsContainer");
  container.innerHTML = "";

  products.forEach(item => {
    const option = item.options.find(o => o.size === size);

    if (option) {
      container.innerHTML += `
        <div style="
          background:#fff;
          padding:20px;
          border-radius:15px;
          margin-bottom:25px;
          box-shadow:0 4px 10px rgba(0,0,0,0.1);
          text-align:center;">
          
          <img src="${option.img}" style="width:200px; border-radius:10px; margin-bottom:15px;">
          
          <h3 style="font-size:22px; font-weight:bold;">${item.name}</h3>
          <p style="font-size:15px; color:#555; margin:10px 0;">${option.desc}</p>
          
          <p style="font-size:20px; font-weight:bold; margin-top:10px;">${option.price}₪</p>

        </div>
      `;
    }
  });

  updateButtons();
}

// تفعيل الزر المختار
function updateButtons() {
  document.getElementById("btn100").style.background = currentSize === "100ml" ? "#000" : "#e4e4e4";
  document.getElementById("btn100").style.color = currentSize === "100ml" ? "white" : "black";

  document.getElementById("btn50").style.background = currentSize === "50ml" ? "#000" : "#e4e4e4";
  document.getElementById("btn50").style.color = currentSize === "50ml" ? "white" : "black";
}

// عند الضغط على أحد الأزرار
document.getElementById("btn100").onclick = () => displayProducts("100ml");
document.getElementById("btn50").onclick = () => displayProducts("50ml");
</script>
