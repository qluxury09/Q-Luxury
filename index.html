<!-- Full HTML site with product management, protected add/delete, localStorage persistence -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>متجر بسيط</title>
<style>
body { font-family: sans-serif; padding:20px; background:#f2f2f2; }
#adminBtn { padding:10px 20px; background:black; color:white; border:none; cursor:pointer; margin-bottom:20px; }
#productForm, #orderPage { display:none; background:white; padding:20px; border-radius:10px; margin-top:20px; }
.product { background:white; padding:10px; border-radius:10px; margin-bottom:15px; }
.product img { width:140px; border-radius:8px; }
button { cursor:pointer; }
.deleteBtn { background:red; color:white; border:none; padding:5px 10px; margin-top:5px; display:none; }
.addToCartBtn, .buyNowBtn { background:#008cff; color:white; border:none; padding:7px 12px; margin:3px; }
</style>
</head>
<body>

<button id="adminBtn">🔒 الدخول كمدير</button>

<div id="productForm">
<h3>إضافة منتج جديد</h3>
<input type="text" id="pName" placeholder="اسم المنتج"><br><br>
<input type="number" id="pPrice" placeholder="السعر"><br><br>
<textarea id="pDesc" placeholder="الوصف"></textarea><br><br>
<input type="file" id="pImage" accept="image/*"><br><br>
<button onclick="saveProduct()">حفظ المنتج</button>
</div>

<h2>المنتجات</h2>
<div id="products"></div>

<div id="orderPage">
<h3>إتمام الطلب</h3>
<label>المنطقة:</label>
<select id="region" onchange="updateShipping()">
<option value="none">اختر المنطقة</option>
<option value="jerusalem">القدس</option>
<option value="westbank">الضفة</option>
<option value="inside48">الداخل</option>
</select>
<br><br>
<label>العنوان بالتفصيل:</label><br>
<input type="text" id="address"><br><br>
<label>رقم الهاتف:</label><br>
<input type="text" id="phone"><br><br>
<label>الاسم الكامل:</label><br>
<input type="text" id="fullname"><br><br>
<label>ملاحظات:</label><br>
<textarea id="notes"></textarea><br><br>
<h4 id="totalPrice"></h4>
<button onclick="sendOrder()">إرسال الطلب عبر واتساب</button>
</div>

<script>
let adminMode = false;
let password = "qais.islam.2009.2025";
let shippingPrices = { jerusalem:30, westbank:20, inside48:70 };
let cart = [];

function loadProducts() {
 let list = JSON.parse(localStorage.getItem("products") || "[]");
 let box = document.getElementById("products");
 box.innerHTML = "";
 list.forEach((p,i)=>{
  let div = document.createElement("div");
  div.className = "product";
  div.innerHTML = `
   <img src="${p.img}"><br>
   <h3>${p.name}</h3>
   <p>${p.desc}</p>
   <p><b>${p.price} شيكل</b></p>
   <button class="addToCartBtn" onclick="addToCart(${i})">إضافة للسلة</button>
   <button class="buyNowBtn" onclick="directBuy(${i})">شراء الآن</button>
   <button class="deleteBtn" id="del${i}" onclick="deleteProduct(${i})">حذف المنتج</button>
  `;
  box.appendChild(div);
  if(adminMode) document.getElementById(`del${i}`).style.display = "block";
 });
}

function saveProduct() {
 let name = document.getElementById("pName").value;
 let price = document.getElementById("pPrice").value;
 let desc = document.getElementById("pDesc").value;
 let imgFile = document.getElementById("pImage").files[0];
 if(!name || !price || !imgFile) return alert("يرجى تعبئة كل الحقول الأساسية");
 let reader = new FileReader();
 reader.onload = ()=>{
  let list = JSON.parse(localStorage.getItem("products") || "[]");
  list.push({name,price,desc,img:reader.result});
  localStorage.setItem("products", JSON.stringify(list));
  loadProducts();
 };
 reader.readAsDataURL(imgFile);
}

function deleteProduct(i){
 let list = JSON.parse(localStorage.getItem("products") || "[]");
 list.splice(i,1);
 localStorage.setItem("products", JSON.stringify(list));
 loadProducts();
}

function addToCart(i){
 let list = JSON.parse(localStorage.getItem("products") || "[]");
 cart.push(list[i]);
 alert("تمت إضافة المنتج للسلة");
}

function directBuy(i){
 let list = JSON.parse(localStorage.getItem("products") || "[]");
 cart = [list[i]];
 openOrderPage();
}

function openOrderPage(){
 document.getElementById("orderPage").style.display = "block";
 updateTotal();
}
function updateShipping(){ updateTotal(); }
function updateTotal(){
 let sum = cart.reduce((a,b)=>a+Number(b.price),0);
 let r = document.getElementById("region").value;
 if(r!="none") sum += shippingPrices[r];
 document.getElementById("totalPrice").innerHTML = "المجموع: "+sum+" شيكل";
}

function sendOrder(){
 let regionTxt = document.getElementById("region").value;
 let address = document.getElementById("address").value;
 let phone = document.getElementById("phone").value;
 let fullname = document.getElementById("fullname").value;
 let notes = document.getElementById("notes").value;
 if(regionTxt=="none" || !address || !phone || !fullname) return alert("يرجى تعبئة كل الحقول");
 let prodList = cart.map(p=>`- ${p.name} (${p.price} شيكل)`).join("\n");
 let msg = `طلب جديد:%0Aالاسم: ${fullname}%0Aالمنطقة: ${regionTxt}%0Aالعنوان: ${address}%0A
الهاتف: ${phone}%0Aالمنتجات:%0A${prodList}%0Aملاحظات: ${notes}`;
 window.open(`https://wa.me/00970595479161?text=${msg}`);
}

// Admin login
adminBtn.onclick = ()=>{
 let x = prompt("أدخل كلمة السر:");
 if(x === password){
  adminMode = true;
  document.getElementById("productForm").style.display = "block";
  loadProducts();
 } else alert("خطأ");
};

loadProducts();
</script>

</body>
</html>
