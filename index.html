<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المتجر</title>

<style>
/* --- ألوان --- */
body {
    font-family: sans-serif;
    background: #ffe7c2; /* اللون الرئيسي */
    padding: 15px;
    margin: 0;
    font-size: 18px;
}

/* --- زر المدير --- */
button, a {
    cursor: pointer;
    border: none;
    border-radius: 8px;
    font-size: 18px;
    padding: 12px 20px;
}

/* --- إخفاء عناصر --- */
.hidden { display: none; }

/* --- الهيدر --- */
header {
    display: flex;
    justify-content: flex-start;
    gap: 15px;
    margin-bottom: 20px;
}

#adminBtn {
    background: #000000;  /* أسود */
    color: white;
}

/* --- لوحة المدير --- */
#adminPanel, .product, #checkoutPage {
    background: white;
    padding: 20px;
    border-radius: 15px;
    margin-bottom: 20px;
}

/* --- المنتجات --- */
.product {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
    text-align: center;
}

.product img {
    width: 100%;
    max-width: 250px;
    border-radius: 15px;
}

/* --- أزرار --- */
.buyNowBtn {
    background: #000000;
    color: white;
    width: 100%;
}

.deleteBtn {
    background: red;
    color: white;
    width: 100%;
    padding: 10px;
}

input, textarea, select {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    font-size: 18px;
    border-radius: 8px;
}

/* --- صفحة الإتمام --- */
#checkoutPage h2, #checkoutPage h3 {
    text-align: center;
}

/* --- responsive --- */
@media (max-width: 600px) {
    body {
        font-size: 20px;
        padding: 10px;
    }

    button {
        font-size: 20px;
        padding: 15px 20px;
    }

    .product img {
        max-width: 100%;
    }
}
</style>
</head>
<body>

<header>
    <button id="adminBtn">🔒 دخول المدير</button>
</header>

<!-- لوحة المدير -->
<div id="adminPanel" class="hidden">
    <h3>إضافة منتج جديد</h3>
    <input id="pName" type="text" placeholder="اسم المنتج">
    <input id="pPrice" type="number" placeholder="السعر">
    <textarea id="pDesc" placeholder="الوصف"></textarea>
    <input id="pImage" type="file" accept="image/*">
    <button onclick="saveProduct()">حفظ المنتج</button>
</div>

<!-- المنتجات -->
<h2>المنتجات</h2>
<div id="products"></div>

<!-- صفحة إتمام الطلب -->
<div id="checkoutPage" class="hidden">
    <button onclick="closeCheckout()" style="background:#000;color:white;">⬅ الرجوع</button>
    <h2>إتمام الطلب</h2>

    <label>المنطقة:</label>
    <select id="region" onchange="updateCheckout()">
        <option value="none">اختر المنطقة</option>
        <option value="jerusalem">القدس</option>
        <option value="westbank">الضفة</option>
        <option value="inside48">الداخل</option>
    </select>

    <label>الاسم الكامل:</label>
    <input type="text" id="fullname">

    <label>الهاتف:</label>
    <input type="text" id="phone">

    <label>العنوان:</label>
    <input type="text" id="address">

    <label>ملاحظات:</label>
    <textarea id="notes"></textarea>

    <h3 id="checkoutTotal"></h3>

    <button onclick="sendOrder()" class="buyNowBtn">إرسال الطلب</button>
</div>

<script>
/* -----------------------------
   المتغيرات الأساسية
----------------------------- */
let products = JSON.parse(localStorage.getItem("products") || "[]");
let lastBuy = []; // آخر عملية شراء فقط
let adminMode = false;
let password = "qais.islam.2009.2025";

/* -----------------------------
   حفظ البيانات
----------------------------- */
function saveProducts(){
    localStorage.setItem("products", JSON.stringify(products));
}

/* -----------------------------
   تحميل المنتجات
----------------------------- */
function loadProducts(){
    let box = document.getElementById("products");
    box.innerHTML = "";

    products.forEach((p, i)=>{
        box.innerHTML += `
            <div class="product">
                <img src="${p.img}">
                <h3>${p.name}</h3>
                <p>${p.desc}</p>
                <p><b>${p.price} شيكل</b></p>
                <button class="buyNowBtn" onclick="buyNow(${i})">شراء الآن</button>
                ${adminMode ? `<button class="deleteBtn" onclick="deleteProduct(${i})">حذف</button>` : ""}
            </div>
        `;
    });
}
loadProducts();

/* -----------------------------
   شراء الآن (بدون سلة)
----------------------------- */
function buyNow(i){
    lastBuy = [ products[i] ];
    openCheckout();
}

/* -----------------------------
   صفحة الإتمام
----------------------------- */
let shipping = { jerusalem:30, westbank:20, inside48:70 };
const regionInput = document.getElementById("region");
const checkoutTotal = document.getElementById("checkoutTotal");
const fullname = document.getElementById("fullname");
const phone = document.getElementById("phone");
const address = document.getElementById("address");
const notes = document.getElementById("notes");

function openCheckout(){
    document.getElementById("checkoutPage").classList.remove("hidden");
    updateCheckout();
}

function closeCheckout(){
    document.getElementById("checkoutPage").classList.add("hidden");
}

function updateCheckout(){
    let region = regionInput.value;
    let total = lastBuy.reduce((a,b)=>a+Number(b.price),0);

    if(region !== "none"){
        total += shipping[region];
    }

    checkoutTotal.innerHTML = "المجموع النهائي: " + total + " شيكل";
}

/* -----------------------------
   إرسال الطلب
----------------------------- */
function sendOrder(){
    let name = fullname.value;
    let phoneNumber = phone.value;
    let addr = address.value;
    let region = regionInput.value;

    if(!name || !phoneNumber || !addr || region === "none"){
        alert("يرجى تعبئة جميع البيانات");
        return;
    }

    let items = lastBuy.map(p => `- ${p.name} (${p.price} شيكل)`).join("\n");

    let msg =
`طلب جديد:
الاسم: ${name}
الهاتف: ${phoneNumber}
المنطقة: ${region}
العنوان: ${addr}

المنتجات:
${items}

ملاحظات:
${notes.value}`;

    window.open("https://wa.me/00970595479161?text=" + encodeURIComponent(msg));
}

/* -----------------------------
   إضافة منتج جديد
----------------------------- */
function saveProduct(){
    let name = pName.value;
    let price = pPrice.value;
    let desc = pDesc.value;
    let imgFile = pImage.files[0];

    if(!name || !price || !imgFile){
        alert("يرجى تعبئة البيانات");
        return;
    }

    let r = new FileReader();
    r.onload = ()=>{
        products.push({
            name,
            price,
            desc,
            img: r.result
        });

        saveProducts();
        loadProducts();
        alert("تم إضافة المنتج");
    };
    r.readAsDataURL(imgFile);
}

/* -----------------------------
   حذف المنتج
----------------------------- */
function deleteProduct(i){
    products.splice(i, 1);
    saveProducts();
    loadProducts();
}

/* -----------------------------
   تسجيل دخول المدير
----------------------------- */
adminBtn.onclick = ()=>{
    let x = prompt("أدخل كلمة السر:");

    if(x === password){
        adminMode = true;
        adminPanel.classList.remove("hidden");
        loadProducts();
    } else {
        alert("كلمة السر خاطئة");
    }
};
</script>

</body>
</html>
