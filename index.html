<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>متجر بسيط</title>
  <style>
    body { font-family: sans-serif; background:#f2f2f2; padding:20px; }
    .product { background:#fff; padding:15px; margin-bottom:15px; border-radius:10px; }
    .btn { background:#000; color:#fff; padding:10px 15px; border:none; border-radius:8px; cursor:pointer; }
    .form-box { background:#fff; padding:20px; border-radius:10px; }
    input, select, textarea { width:100%; margin:8px 0; padding:10px; border-radius:6px; border:1px solid #ccc; }
  </style>
</head>
<body>

  <h2>المنتجات</h2>

  <!-- زر دخول الإدارة -->
  <button class="btn" onclick="askPassword()">🔒 دخول الإدارة</button>

  <!-- يظهر فقط بعد إدخال كلمة السر -->
  <div id="adminButtons" style="display:none;">
      <button class="btn" onclick="showAddForm()">إضافة منتج جديد</button>
  </div>

  <!-- فورم إضافة منتج -->
  <div id="addForm" style="display:none; margin-top:20px;" class="form-box">
    <h3>إضافة منتج</h3>
    <label>اسم المنتج</label>
    <input id="newName" type="text" placeholder="اسم المنتج" />

    <label>السعر</label>
    <input id="newPrice" type="number" placeholder="السعر" />

    <label>الوصف</label>
    <textarea id="newDesc" placeholder="الوصف"></textarea>

    <label>صور المنتج</label>
    <input id="newImages" type="file" accept="image/*" multiple />

    <button class="btn" onclick="saveProduct()">حفظ المنتج</button>
  </div>

  <div id="productsContainer"></div>

  <!-- صفحة تعبئة الطلب -->
  <div id="formPage" style="display:none;">
      <h2>إتمام الطلب</h2>
      <div class="form-box">
        <p id="prodName"></p>
        <p id="prodPrice"></p>

        <label>المنطقة</label>
        <select id="zone" onchange="updateShipping()">
          <option value="">اختر المنطقة</option>
          <option value="القدس" data-ship="20">القدس (+20₪)</option>
          <option value="الضفة" data-ship="15">الضفة (+15₪)</option>
          <option value="الداخل" data-ship="25">الداخل (+25₪)</option>
        </select>

        <label>المنطقة بالتفصيل</label>
        <input id="details" type="text" placeholder="مثال: رام الله - الإرسال" />

        <label>الاسم الكامل</label>
        <input id="fullname" type="text" />

        <label>رقم الهاتف</label>
        <input id="phone" type="text" />

        <label>ملاحظات (اختياري)</label>
        <textarea id="notes"></textarea>

        <h3 id="total"></h3>

        <button class="btn" onclick="sendWhatsApp()">إرسال الطلب على واتساب</button>
      </div>
    </div>

<script>

/* ---------------------------------------------------
   كلمة سر المدير
----------------------------------------------------*/
function askPassword() {
    let pass = prompt("أدخل كلمة السر للدخول للإدارة:");

    if (pass === "qadmin123") {
        document.getElementById("adminButtons").style.display = "block";
        document.querySelector('button[onclick="askPassword()"]').style.display = "none";
        alert("تم تسجيل الدخول كمدير ✔");
    } else {
        alert("كلمة السر خاطئة ❌");
    }
}

/* ---------------------------------------------------
   تخزين وجلب المنتجات من LocalStorage
----------------------------------------------------*/

function getProducts() {
    return JSON.parse(localStorage.getItem("products")) || [];
}

function saveProductsToStorage(products) {
    localStorage.setItem("products", JSON.stringify(products));
}

/* ---------------------------------------------------
   عرض المنتجات
----------------------------------------------------*/

function displayProducts() {
    let products = getProducts();
    let container = document.getElementById("productsContainer");
    container.innerHTML = "";

    products.forEach((p, index) => {
        let imagesHTML = "";
        p.images.forEach(img => {
            imagesHTML += `<img src="${img}" style="width:120px; margin:5px; border-radius:10px;">`;
        });

        container.innerHTML += `
            <div class="product">
                <h3>${p.name}</h3>
                <p>السعر: ${p.price}₪</p>
                <p>${p.desc}</p>
                <div>${imagesHTML}</div>
                <button class="btn" onclick="buy('${p.name}', ${p.price})">شراء الآن</button>
            </div>
        `;
    });
}

/* ---------------------------------------------------
   إضافة منتج جديد
----------------------------------------------------*/

function showAddForm() {
  document.getElementById('addForm').style.display = 'block';
}

function saveProduct() {
  let name = document.getElementById('newName').value;
  let price = document.getElementById('newPrice').value;
  let desc = document.getElementById('newDesc').value;
  let files = document.getElementById('newImages').files;

  if (!name || !price || files.length === 0) {
    alert("يرجى إدخال اسم المنتج والسعر وصورة واحدة على الأقل");
    return;
  }

  let imagesBase64 = [];
  let loaded = 0;

  for (let i = 0; i < files.length; i++) {
      let reader = new FileReader();
      reader.onload = function(e) {
          imagesBase64.push(e.target.result);
          loaded++;

          if (loaded === files.length) {
              let products = getProducts();

              products.push({
                  name: name,
                  price: Number(price),
                  desc: desc,
                  images: imagesBase64
              });

              saveProductsToStorage(products);
              displayProducts();
          }
      };
      reader.readAsDataURL(files[i]);
  }

  document.getElementById("addForm").style.display = "none";

  document.getElementById('newName').value = "";
  document.getElementById('newPrice').value = "";
  document.getElementById('newDesc').value = "";
  document.getElementById('newImages').value = "";
}

/* ---------------------------------------------------
   صفحة الشراء
----------------------------------------------------*/

let selectedProduct = {};

function buy(name, price) {
  selectedProduct = { name, price, shipping:0 };
  document.getElementById('prodName').innerText = 'المنتج: ' + name;
  document.getElementById('prodPrice').innerText = 'السعر: ' + price + '₪';
  document.getElementById('formPage').style.display = 'block';
}

function updateShipping() {
  let zone = document.getElementById('zone');
  let ship = zone.options[zone.selectedIndex].dataset.ship;
  selectedProduct.shipping = Number(ship);
  document.getElementById('total').innerText =
      'المجموع الكلي: ' + (selectedProduct.price + selectedProduct.shipping) + '₪';
}

function sendWhatsApp() {
  let name = selectedProduct.name;
  let price = selectedProduct.price;
  let zone = document.getElementById('zone').value;
  let details = document.getElementById('details').value;
  let fullname = document.getElementById('fullname').value;
  let phone = document.getElementById('phone').value;
  let notes = document.getElementById('notes').value;
  
  let total = price + selectedProduct.shipping;

  let msg =
`طلب جديد:
------------------
المنتج: ${name}
السعر: ${price}₪
المنطقة: ${zone}
تفاصيل المنطقة: ${details}
الاسم الكامل: ${fullname}
الهاتف: ${phone}
ملاحظات: ${notes}
المجموع الكلي: ${total}₪`;

  window.open(`https://wa.me/00970595479161?text=${encodeURIComponent(msg)}`);
}

displayProducts();

</script>

</body>
</html>
