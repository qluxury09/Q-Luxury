<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q Luxury</title>

<!-- خط عربي احترافي -->
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    
<style>
/* --- الأساسيات --- */
body {
    font-family: "Tajawal", sans-serif;
    background: #faf7f2;
    margin: 0;
    padding: 15px;
    color: #333;
}

/* --- عنوان رئيسي --- */
h2 {
    text-align: center;
    font-size: 28px;
    margin: 20px 0;
    font-weight: 700;
}

/* --- بطاقة المنتج --- */
.product {
    background: #fff;
    padding: 18px;
    margin-bottom: 22px;
    border-radius: 20px;
    box-shadow: 0 4px 10px #00000015;
    transition: 0.3s;
}
.product:hover {
    transform: translateY(-4px);
    box-shadow: 0 6px 14px #00000025;
}
.product img {
    width: 100%;
    border-radius: 15px;
}
.product h3 {
    font-size: 22px;
    margin: 10px 0;
}
.product p {
    color: #555;
    font-size: 16px;
    margin-bottom: 8px;
}

/* --- زر شراء الآن --- */
.buyNowBtn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;

    background: #0d0d0d;
    color: white;
    width: 100%;
    padding: 14px;
    border-radius: 14px;
    border: none;
    font-size: 20px;
    cursor: pointer;
    transition: 0.25s;
}
.buyNowBtn:hover {
    background: #333;
    transform: scale(1.03);
}

/* --- أيقونة العربة --- */
.buyNowBtn svg {
    width: 22px;
    fill: #fff;
}

/* --- صفحة الإتمام --- */
#checkoutPage {
    background: white;
    padding: 22px;
    border-radius: 22px;
    margin-top: 20px;
    box-shadow: 0 4px 15px #00000020;
}
#checkoutPage h2 {
    font-size: 26px;
}

/* --- الحقول --- */
input, textarea, select {
    width: 100%;
    padding: 14px;
    margin: 10px 0;
    border-radius: 12px;
    font-size: 18px;
    border: 1px solid #ddd;
    transition: 0.25s;
}
input:focus, textarea:focus, select:focus {
    border-color: #000;
}
}

/* --- موبايل أولاً --- */
@media (min-width: 700px) {
    body {
        width: 600px;
        margin: auto;
    }
}
</style>
</head>

<body>

<h2>🛍️عطورنا</h2>

<div id="products"></div>

<!-- صفحة الإتمام -->
<div id="checkoutPage" class="hidden">

    <h2>إتمام الطلب</h2>

    <label>المنطقة:</label>
    <select id="region" onchange="updateCheckout()">
        <option value="none">اختر المنطقة</option>
        <option value="westbank">الضفة — ₪20</option>
        <option value="jerusalem">القدس — ₪30</option>
        <option value="inside48">الداخل — ₪70</option>
    </select>

     <label>العنوان بالتفصيل:</label>
    <input type="text" id="address">
    
    <label>الاسم الكامل:</label>
    <input type="text" id="fullname">

    <label>رقم الهاتف:</label>
    <input type="text" id="phone">

    <label>ملاحظات:</label>
    <textarea id="notes"></textarea>

    <h3 id="checkoutTotal" style="text-align:center;"></h3>

    <button onclick="sendOrder()" class="buyNowBtn">
        إرسال الطلب
        <svg viewBox="0 0 512 512"><path d="M476 3L12 217c-16 7-15 30 1 36l111 40 41 111c6 16 29 17 36 1L476 36c7-17-11-35-28-28zM175 319l17 48 32-72 137-137c6-6 6-16 0-22s-16-6-22 0L202 273l-74-27 347-157-300 230z"/></svg>
    </button>
</div>

<script>
/* --- تحميل المنتجات --- */
let products = [];

fetch("products.json")
  .then(res => res.json())
  .then(data => {
      products = data;
      loadProducts();
  });

/* --- عرض المنتجات --- */
function loadProducts(){
    let box = document.getElementById("products");
    box.innerHTML = "";

    products.forEach((p, i)=>{
        box.innerHTML += `
            <div class="product">
                <img src="${p.img}">
                <h3>${p.name}</h3>
                <p>${p.desc}</p>
                <p><b>₪${p.price}</b></p>

                <button class="buyNowBtn" onclick="buyNow(${i})">
                    <svg viewBox="0 0 24 24"><path d="M7 4h-2l-1 2h2l3.6 7.59-1.35 2.44c-.16.28-.25.61-.25.97 0 1.1.9 2 2 2h10v-2h-10l1.1-2h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1h-16.31l-.94-2zm-3 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2zm14 0c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"></path></svg>
                    شراء الآن
                </button>
            </div>
        `;
    });
}

/* --- شراء --- */
let lastBuy = [];

function buyNow(i){
    lastBuy = [products[i]];
    openCheckout();
}

let shipping = { jerusalem:30, westbank:20, inside48:70 };

function openCheckout(){
    document.getElementById("checkoutPage").classList.remove("hidden");
    updateCheckout();
}
function closeCheckout(){
    document.getElementById("checkoutPage").classList.add("hidden");
}

/* --- حساب المجموع --- */
function updateCheckout(){
    let region = document.getElementById("region").value;
    let total = lastBuy[0].price;

    if(region !== "none"){
        total += shipping[region];
    }

    document.getElementById("checkoutTotal").innerHTML = "المجموع النهائي: ₪" + total;
}

/* --- إرسال الواتساب --- */
function sendOrder(){
    let name = fullname.value;
    let phoneNumber = phone.value;
    let addr = address.value;
    let region = document.getElementById("region").value;

    if(!name || !phoneNumber || !addr || region === "none"){
        alert("يرجى تعبئة جميع البيانات");
        return;
    }

    let msg = 
`طلب جديد:
الاسم: ${name}
الهاتف: ${phoneNumber}
المنطقة: ${region}
العنوان: ${addr}

المنتج:
- ${lastBuy[0].name} — ₪${lastBuy[0].price}

ملاحظات:
${notes.value}`;

     let phone = "970595479161";

    // فتح واتساب بزنس مع الرسالة
    window.location.href = "https://wa.me/" + phone + "?text=" + encodeURIComponent(msg);
}
}
</script>

</body>
</html>
